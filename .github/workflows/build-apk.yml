name: Build Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build JAYVEERMart Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Production Bundle
        run: npm run build
        env:
          CAPACITOR_BUILD: 'true'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      - name: Compile Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Outputs
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/JAYVEERMart-debug.apk
          echo "APK successfully generated!"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JAYVEERMart-Android-APK
          path: build-output/JAYVEERMart-debug.apk
          retention-days: 30

      - name: Publish Direct APK Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: 'JAYVEERMart Android APK (Latest)'
          body: |
            ### 📱 JAYVEERMart Android APK
            Latest APK generated from commit `${{ github.sha }}`.

            Download **`JAYVEERMart-debug.apk`** directly to your phone.
          files: build-output/JAYVEERMart-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
