<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle Badge -->
  <rect x="32" y="32" width="448" height="448" rx="110" fill="url(#bgGrad)" filter="url(#shadow)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="6" />

  <!-- Shopping Bag Handle -->
  <path d="M192 200 V156 C192 120 220 92 256 92 C292 92 320 120 320 156 V200" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="24" 
        stroke-linecap="round" />

  <!-- Shopping Bag Body -->
  <rect x="136" y="190" width="240" height="200" rx="36" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Stylized J Letter Monogram in Bag Center -->
  <path d="M266 240 V310 C266 332 248 348 226 348 C206 348 190 334 190 316" 
        fill="none" 
        stroke="url(#glowGrad)" 
        stroke-width="22" 
        stroke-linecap="round" />

  <!-- Golden Sparkle Badge -->
  <path d="M370 170 L378 190 L398 198 L378 206 L370 226 L362 206 L342 198 L362 190 Z" 
        fill="#fbbf24" />
</svg>